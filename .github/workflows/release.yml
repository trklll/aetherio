name: Publish Aetherio

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install MPV runtime
        shell: pwsh
        run: ./scripts/install-mpv.ps1

      - name: Verify updater key lineage
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          $probe = Join-Path $env:RUNNER_TEMP "aetherio-updater-key-check.bin"
          Set-Content -LiteralPath $probe -Value "Aetherio updater key check" -NoNewline
          & ".\node_modules\.bin\tauri.cmd" signer sign "--password=" $probe
          node scripts/verify-updater-signature.mjs "$probe.sig"

      - name: Build and publish signed update
        id: publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: "Aetherio v__VERSION__"
          releaseBody: "Nueva versión de Aetherio. Consulta los cambios incluidos en esta versión y descarga el instalador para Windows."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true

      - name: Publish release to Aetherio updater and website
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_LEGACY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          AETHERIO_RELEASE_TOKEN: ${{ secrets.AETHERIO_RELEASE_TOKEN }}
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*_x64-setup.exe" |
            Select-Object -First 1
          if (-not $installer) {
            throw "No se encontro el instalador NSIS del updater."
          }

          $currentSignaturePath = "$($installer.FullName).sig"
          if (-not (Test-Path -LiteralPath $currentSignaturePath)) {
            throw "No se encontro la firma actual del updater."
          }

          $savedCurrentSignaturePath = "$currentSignaturePath.current"
          $legacySignaturePath = "$($installer.FullName).legacy.sig"
          Move-Item -LiteralPath $currentSignaturePath -Destination $savedCurrentSignaturePath
          try {
            & ".\node_modules\.bin\tauri.cmd" signer sign "--password=" "$($installer.FullName)"
            Move-Item -LiteralPath $currentSignaturePath -Destination $legacySignaturePath
          } finally {
            Move-Item -LiteralPath $savedCurrentSignaturePath -Destination $currentSignaturePath -Force
          }

          $version = "${{ steps.publish.outputs.appVersion }}"
          $tagName = "v$version"
          gh release upload $tagName $legacySignaturePath --repo "${{ github.repository }}" --clobber

          $assetUrl = "https://github.com/${{ github.repository }}/releases/download/$tagName/$($installer.Name)"
          $payload = @{
            version = $version
            notes = "Nueva version de Aetherio."
            pubDate = (Get-Date).ToUniversalTime().ToString("o")
            url = $assetUrl
            size = $installer.Length
            sha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            signatureCurrent = (Get-Content -LiteralPath $currentSignaturePath -Raw).Trim()
            signatureLegacy = (Get-Content -LiteralPath $legacySignaturePath -Raw).Trim()
          } | ConvertTo-Json -Compress

          Invoke-RestMethod `
            -Uri "https://aetherio.aetherio.workers.dev/api/internal/releases" `
            -Method Post `
            -Headers @{ Authorization = "Bearer $env:AETHERIO_RELEASE_TOKEN" } `
            -ContentType "application/json" `
            -Body $payload

          $websiteRelease = Invoke-RestMethod `
            -Uri "https://aetherio.aetherio.workers.dev/api/release?version=$version"
          if ($websiteRelease.version -ne $version) {
            throw "La web no anuncia la version $version."
          }
          if ($websiteRelease.downloadUrl -ne "/download/windows") {
            throw "La web no usa la ruta de descarga directa."
          }

          $downloadProbe = & curl.exe `
            --silent `
            --show-error `
            --head `
            --output NUL `
            --write-out "%{http_code}`n%{redirect_url}" `
            "https://aetherio.aetherio.workers.dev/download/windows?version=$version"
          if ($LASTEXITCODE -ne 0) {
            throw "No se pudo consultar la descarga web."
          }
          $probeLines = @($downloadProbe -split "\r?\n")
          $downloadStatus = $probeLines[0].Trim()
          $downloadLocation = $probeLines[1].Trim()
          if ($downloadStatus -ne "302") {
            throw "La descarga web no respondio con una redireccion directa."
          }
          $expectedAsset = "https://github.com/${{ github.repository }}/releases/download/$tagName/"
          if (-not $downloadLocation.StartsWith($expectedAsset) -or
              -not $downloadLocation.EndsWith("_x64-setup.exe")) {
            throw "La descarga web no apunta al instalador del release."
          }
